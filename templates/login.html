<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Help Desk</title>
  </head>
  <body>
    <div class="container-login">
        <div class="card-login">
        <div class="logo-login">
            <img src="{{ url_for('static', filename='img/headset.svg') }}" alt="Logo Help Desk">
        </div>
            <h1>HelpDesk</h1>
            <p>Entre na sua conta</p>
            <form method="post" action="{{ url_for('login') }}">
                <div class="campo">
                    <label for="e-mail">E-mail:</label>
                    <input type="email" id="e-mail" name="e-mail" required>
                </div>
                <div class="campo">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-login">Entrar</button>
            </form>
            <div class="link-cadastro">
            <p class="link-cadastro">Não tem uma conta? <a href="{{ url_for('cadastro') }}">Cadastre-se</a> </p>
            </div>
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <p class="mensagem">{{ messages[0] }}</p>
                {% endif %}
            {% endwith %}
        </div>
    </div>
  </body>
</html>
